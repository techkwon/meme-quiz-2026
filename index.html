<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>밈력고사 2026 · 너 혹시 늙크크?</title>
<style>
:root{--bg:#0f0f1a;--card:#1c1b2e;--hot:#ff5c8a;--lime:#c6ff4a;--sky:#5cc8ff;--txt:#f4f2ff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:radial-gradient(circle at 20% 10%,#2a1b4a,var(--bg) 60%);color:var(--txt);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px;overflow-x:hidden}
.wrap{width:100%;max-width:640px}
.card{background:var(--card);border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008;position:relative;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
h1{font-size:2.2rem;margin:.2em 0;line-height:1.2}h1 span{color:var(--lime)}
.tag{display:inline-block;background:var(--hot);padding:4px 12px;border-radius:99px;font-weight:700;font-size:.85rem}
.sub{opacity:.8;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 18px;font-weight:700;transition:transform .15s}
button:hover,button:focus-visible{transform:translateY(-2px)}button:focus-visible{outline:3px solid var(--lime)}
.go{background:var(--lime);color:#111;font-size:1.15rem;width:100%;margin-top:18px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{background:#2a2944;color:var(--txt);text-align:left;font-size:1.02rem}
.opt.right{background:#1f6b3a;animation:bounce .4s}.opt.wrong{background:#7a2236;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bounce{50%{transform:scale(1.04)}}
.bar{height:10px;background:#2a2944;border-radius:99px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--hot));transition:width .4s}
.q{font-size:1.35rem;font-weight:800;line-height:1.45}
.fb{margin-top:16px;padding:14px;border-radius:14px;background:#12121f;line-height:1.6;display:none}
.fb b{color:var(--lime)}.src{font-size:.75rem;opacity:.6;margin-top:8px}
.emo{font-size:3.5rem;text-align:center}
.meter{font-size:3rem;font-weight:900;text-align:center;color:var(--lime)}
.foot{font-size:.75rem;opacity:.55;text-align:center;margin-top:14px;line-height:1.5}
.bubble{position:fixed;font-weight:800;opacity:.07;pointer-events:none;animation:float 14s linear infinite;font-size:2rem}
@keyframes float{from{transform:translateY(110vh)}to{transform:translateY(-20vh)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bubble{display:none}}
</style></head><body>
<div id="bg"></div>
<main class="wrap"><div id="app"></div>
<p class="foot">수업용 퀴즈 · 개인정보를 저장하거나 보내지 않습니다 · 밈 뜻은 2026-10-23 기사·블로그 기준이며 계속 바뀔 수 있어요</p></main>
<script>
const Q=[
{q:"친구가 나보고 \"너 완전 늙크크네\"라고 했다. 무슨 뜻일까?",o:["늙어도 크게 웃는 사람","유행에 어두운 사람","크림빵을 좋아하는 어르신","늘 크크크 하고 웃는 사람"],a:1,w:"반대말은 '영크크'(유행에 밝은 사람). 다만 나이 놀리는 느낌이 있어서, 진짜 어른한테 쓰면 분위기 줴줴이야.",s:"문화일보(2026.10.8), 서울경제"},
{q:"\"이 필통 디자인 좀 밤티다.\" 여기서 밤티는?",o:["밤처럼 고소하다","밤새 만든 티가 난다","촌스럽다, 별로다","밤색 티셔츠"],a:2,w:"물건·디자인에만 쓰기! 사람 외모에 쓰는 순간 본인이 밤티 됩니다.",s:"문화일보(2026.10.8), HSAD 블로그 [월간 2026 밈] 10월 편"},
{q:"수행평가 3개가 같은 날 겹쳤다. 이때 튀어나오는 한 마디는?",o:["줴줴이야","아자스","영크크","밤티 났다"],a:0,w:"게임 끝날 때 쓰는 GG(Good Game)를 익살스럽게 읽은 말. '망했다'를 귀엽게 포장하는 기술.",s:"HSAD 블로그 [월간 2026 밈] 10월 편 · 추가 출처 확인 권장"},
{q:"급식 아주머니께 \"아자스!\" 했다. 무슨 뜻으로 한 말?",o:["아자! 힘내세요","감사합니다","아 자세히 설명해 주세요","아 자고 싶다"],a:1,w:"일본어 '아리가토 고자이마스'를 줄인 말. 근데 어른께는 그냥 '감사합니다'가 만점 답안입니다.",s:"문화일보(2026.10.8) · [확인 필요] 추가 출처"},
{q:"\"이 노래 좋다 (팬인 건 ❌)\" 괄호 속 ❌의 정체는?",o:["노래를 싫어한다는 뜻","칭찬한 뒤 오해받기 싫어 붙이는 해명","오타","팬클럽 탈퇴 선언"],a:1,w:"좋은 건 좋은데 너무 진심으로 보이긴 싫을 때 쓰는 방어 말투. 사실 우리 다 알아요.",s:"HSAD 블로그 [월간 2026 밈] 10월 편 · [확인 필요] 추가 출처"},
{q:"[가상 예시] AI가 \"줴줴이야는 일본어 인사말이에요\"라고 답했다. 나의 다음 행동은?",o:["AI가 말했으니 그대로 믿는다","친구 단톡에 바로 퍼뜨린다","출처 2개 이상 찾아서 비교한다","AI한테 화낸다"],a:2,w:"이 AI 답은 수업용으로 만든 가상 예시이고, 내용도 틀렸어요(GG에서 왔죠). AI도 밈 앞에서는 늙크크일 수 있습니다.",s:"수업용 가상 응답 · 실제 서비스 출력 아님"},
{q:"같은 질문을 AI에게 두 번 하면 답이 조금씩 다를 수 있다?",o:["X, AI는 자판기라 늘 같은 답","O, 다음 말을 확률로 고르기 때문"],a:1,w:"AI는 자판기가 아니라 <b>즉흥 래퍼</b>에 가까워요. 다음에 올 말을 확률로 고르니까 답이 달라질 수 있어요."},
{q:"손가락 모양이 이상하면 무조건 AI가 만든 밈이다?",o:["O, 손가락은 못 속인다","X, 단서일 뿐 확정 증거는 아니다"],a:1,w:"단서 하나로 범인 확정하면 <b>탐정 자격증 반납</b>입니다. 사람이 그린 손도 어색할 수 있어요."},
{q:"조회수 1000만 밈 = 모두가 좋아하는 밈이다. O일까 X일까?",o:["O, 숫자는 거짓말 안 함","X, 많이 봤다고 다 좋아한 건 아님"],a:1,w:"화나서 본 사람, 그냥 스쳐 본 사람도 조회수 1. 추천 구조와 사람의 선택이 함께 만든 숫자예요.",s:"수업 개념 정리 · 플랫폼별 추천 방식은 다 공개되지 않음"},
{q:"AI 탐지기가 \"AI 생성 확률 90%\"라고 했다. 결론은?",o:["무조건 AI가 만들었다","단서일 뿐, 처음 올린 곳·날짜·생성 표기를 더 확인한다","탐지기가 AI라서 못 믿으니 무시한다"],a:1,w:"탐지기는 판사가 아니라 돋보기. 그래도 모르겠으면 '판단 보류'도 훌륭한 정답입니다.",s:"수업 개념 정리"},
{q:"같은 영상을 봤는데 친구 피드랑 내 피드가 완전 다르다. 왜?",o:["내 폰이 고장 나서","각자 반응한 기록이 달라서 추천이 다를 수 있다","친구가 해킹당해서"],a:1,w:"시청 시간·좋아요·공유 같은 반응이 추천에 쓰일 수 있어요. 실제 가중치는 공개되지 않은 단순화 설명입니다.",s:"수업 개념 정리"},
{q:"마지막! 이 밈 써도 될까? 판단 기준으로 가장 좋은 질문은?",o:["요즘 핫한가?","누군가를 웃음거리로 만들거나 상처 주지 않는가?","길이가 짧은가?"],a:1,w:"뜻을 아는 것보다 중요한 건 '써도 되는 자리인가'를 고르는 눈. 이게 진짜 영크크.",s:"수업 성찰 질문"}
];
const R=[[0,3,"🦕","공룡급 늙크크","괜찮아요, 공룡도 멸종 전엔 트렌디했어요. 오늘 배웠으니 내일은 영크크."],[4,6,"🌰","살짝 밤티","기본기는 있는데 2% 아쉬움. 출처 확인 근육만 키우면 됩니다."],[7,8,"😎","영크크 입문","밈도 알고 검증도 하는 사람. AI보다 한 수 위."],[9,10,"👑","밈력 만렙 · 검증 장인","뜻도 알고, AI 답도 의심하고, 쓸 자리까지 고르는 완성형. 아자스!"]];
const app=document.getElementById('app');let i=0,score=0;
const bg=document.getElementById('bg');["늙크크","밤티","줴줴이야","아자스","❌","영크크","GG"].forEach((t,k)=>{const b=document.createElement('div');b.className='bubble';b.textContent=t;b.style.left=(k*14+3)+'%';b.style.animationDelay=(-k*2)+'s';bg.appendChild(b)});
function start(){app.innerHTML=`<div class="card"><span class="tag">2026 밈력고사</span><h1>너 혹시<br><span>늙크크</span>야?</h1><p class="sub">10문제로 확인하는 나의 밈력 + AI 답 검증력.<br>틀려도 괜찮아요. 줴줴이야 한 번 외치고 다음 문제로.</p><button class="go" onclick="show()">시험지 받기 ✏️</button></div>`}
function show(){const d=Q[i];app.innerHTML=`<div class="card"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><span class="tag">Q${i+1} / ${Q.length}</span><p class="q">${d.q}</p><div class="opts">${d.o.map((t,k)=>`<button class="opt" onclick="pick(${k},this)">${t}</button>`).join('')}</div><div class="fb" id="fb" aria-live="polite"></div></div>`;app.querySelector('.opt').focus()}
function pick(k,el){const d=Q[i],bs=[...document.querySelectorAll('.opt')];bs.forEach(b=>b.disabled=true);const ok=k===d.a;if(ok)score++;bs[d.a].classList.add('right');if(!ok)el.classList.add('wrong');const fb=document.getElementById('fb');fb.style.display='block';fb.innerHTML=`<b>${ok?"정답! 영크크 인정":"앗, 줴줴이야…"}</b><br>${d.w}<div class="src">근거: ${d.s}</div><button class="go" id="nx" onclick="next()">${i<Q.length-1?"다음 문제 →":"결과 보기 🎉"}</button>`;document.getElementById('nx').focus()}
function next(){i++;i<Q.length?show():end()}
function end(){const r=R.find(x=>score>=x[0]&&score<=x[1]);app.innerHTML=`<div class="card"><div class="emo">${r[2]}</div><div class="meter">${score} / ${Q.length}</div><h1 style="text-align:center">${r[3]}</h1><p class="sub" style="text-align:center">${r[4]}</p><p class="sub">한 줄 자기 설명: 내가 틀린 문제 하나를 골라, 왜 헷갈렸는지 실습지에 적어 보세요.</p><button class="go" onclick="i=0;score=0;start()">다시 도전</button></div>`}
start();
</script></body></html>
