<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밈력고사 2026 · 너의 밈 IQ는?</title>
<style>
*{box-sizing:border-box;margin:0}body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#12102b;color:#fff;min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 80% 10%,#5b2aa8,transparent 35%),radial-gradient(circle at 10% 90%,#1d5d7e,transparent 30%);z-index:-1;animation:drift 18s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(4%,3%)}}
.app{width:min(680px,94vw);padding:4vh 0}.card{background:#221f4acc;border:2px solid #ffffff18;border-radius:28px;padding:32px;backdrop-filter:blur(6px);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{transform:scale(.9);opacity:0}}
.tag{display:inline-block;background:#ff4f9a;border-radius:99px;padding:6px 14px;font-weight:800;font-size:14px}h1{font-size:44px;line-height:1.15;margin:16px 0}h1 em{color:#c6ff3d;font-style:normal}
p{color:#cfcbf0;line-height:1.6}.btn{display:block;width:100%;margin-top:14px;padding:18px;border:0;border-radius:18px;font-size:18px;font-weight:700;background:#2e2a63;color:#fff;cursor:pointer;text-align:left;transition:.2s}
.btn:hover,.btn:focus-visible{background:#3d3884;transform:translateX(6px);outline:3px solid #c6ff3d}.go{background:linear-gradient(90deg,#ff4f9a,#7b3cff);text-align:center;font-size:20px}
.ok{background:#1fae66!important}.no{background:#d93a5a!important;animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{height:10px;background:#ffffff15;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4f9a,#c6ff3d);transition:.5s}
.q{font-size:24px;font-weight:800;margin:6px 0}.meta{display:flex;justify-content:space-between;color:#b8b4e0;font-size:14px}
.why{margin-top:18px;padding:16px;border-radius:16px;background:#ffffff10;border-left:6px solid #c6ff3d;display:none}.why b{color:#c6ff3d}
.big{font-size:84px;text-align:center;margin:10px 0}.src{font-size:12px;color:#8d89b8;margin-top:22px}.fake{background:#ffcc00;color:#000;font-weight:800;border-radius:8px;padding:2px 8px;font-size:12px}
.conf{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="app" id="app"></main>
<script>
const Q=[
{q:"친구가 새 필통 보고 \"와… 좀 밤티다\"라고 했다. 무슨 뜻?",o:["밤처럼 단단하고 튼튼하다","촌스럽다, 별로다","밤 맛 간식 이름이다","밤새 공부했다"],a:1,w:"<b>밤티</b> = 촌스럽다·별로다. 단, 물건이나 디자인에만! 친구 얼굴에 쓰는 순간 그건 밈이 아니라 그냥 상처예요."},
{q:"수행평가 3개가 같은 날 겹쳤다. 이때 딱 맞는 탄식은?",o:["아자스","줴줴이야","영크크","젬민이"],a:1,w:"<b>줴줴이야</b>는 게임 용어 GG(Good Game)를 익살스럽게 읽은 말. 게임 끝 → 인생이 안 풀릴 때 쓰는 감탄사로 확장됐어요."},
{q:"\"아자스!\"를 표준어로 번역하면?",o:["아 자세 좀 펴라","감사합니다","아 진짜 스트레스","아자자 화이팅"],a:1,w:"<b>아자스</b>는 일본어 '아리가토 고자이마스'를 줄인 말로 소개됐어요. <span class='fake'>확인 필요</span> 출처가 아직 한 곳뿐이라 수업 전 재확인 중!"},
{q:"유행에 빠삭한 사람은 영크크, 그럼 유행에 어두운 사람은?",o:["올드크크","늙크크","노크크","할크크"],a:1,w:"<b>늙크크</b>. 다만 나이를 놀리는 뉘앙스가 있을 수 있어서, 선생님한테 쓰면… 생활기록부가 영크크하지 않을 수 있습니다."},
{q:"\"이 노래 좋다 (팬인 건 ❌)\" 여기서 ❌의 역할은?",o:["노래가 싫다는 고백","칭찬하고 오해받기 싫어 붙이는 해명","오타","X(트위터) 홍보"],a:1,w:"'~하는 건 ❌'는 좋다고 말해 놓고 \"근데 진지한 건 아님\" 하고 쿨한 척하는 해명 말투예요."},
{q:"AI에게 밈 뜻을 물어보면 항상 정확하다?",o:["O, AI는 다 안다","X, 최신 신조어는 지어낸 답이 나올 수 있다"],a:1,w:"최신 밈은 AI가 배운 자료에 적거나 없을 수 있어요. 그럴듯하게 <b>지어낸 답</b>이 나올 수 있으니 출처 2곳 이상으로 확인!"},
{q:"<span class='fake'>가상 예시</span> AI 답: \"줴줴이야는 일본어 인사말로, 친구를 반길 때 씁니다.\" 판정은?",o:["완벽한 정답","틀렸다, 실제 유래는 GG","반만 맞다, 일본어는 맞음"],a:1,w:"수업용으로 일부러 틀리게 만든 가상 답이에요. 2번 문제에서 본 것처럼 유래는 <b>GG</b>. 이렇게 AI 답도 의심하고 확인하는 게 오늘의 핵심!"},
{q:"조회수 1000만 밈 = 1000만 명이 좋아하는 밈이다?",o:["O, 숫자는 거짓말 안 함","X, 조회수는 노출일 뿐 좋아서 봤는지는 모름"],a:1,w:"조회수는 <b>얼마나 보였는지</b>만 알려 줘요. 짜증 내며 본 것도, 실수로 본 것도 다 1회!"},
{q:"AI 탐지기가 \"AI 생성 확률 90%\"라고 했다. 결론은?",o:["무조건 AI가 만든 것","추정값일 뿐, 다른 단서와 같이 판단","탐지기가 고장 났다"],a:1,w:"탐지기 점수는 <b>추정</b>이고 틀릴 수 있어요. 처음 올린 곳·날짜·생성 표기까지 보고, 그래도 모르면 판단 보류가 정답."},
{q:"친구를 AI에 너무 기댄다고 '젬민이'라고 단톡에 올리려 한다. 가장 좋은 선택은?",o:["바로 올린다, 웃기니까","친구가 상처받을 수 있으니 특정 친구에게는 쓰지 않는다","더 센 별명을 만든다"],a:1,w:"밈을 대할 때 세 가지 질문: ① 누군가를 웃음거리로 만드는가? ② 유래를 알고 쓰는가? ③ 퍼뜨리면 누가 상처받지 않을까?"}
];
const R=[[0,"밈 새내기 🐣","괜찮아요, 오늘부터 영크크 수련 시작!"],[4,"밈 견습생 🔍","감은 있어요. 확인 습관만 붙이면 됩니다."],[7,"밈 탐정 🕵️","AI 답도 의심할 줄 아는 고수!"],[10,"밈 박사 🎓","완벽. 근데 시험 공부도 이만큼… (하는 건 ❌)"]];
let i=0,sc=0;const A=document.getElementById('app');
function start(){A.innerHTML=`<div class="card"><span class="tag">MEME × AI · 2026 가을</span><h1>밈력고사<br><em>너의 밈 IQ는?</em></h1><p>요즘 밈 10문제. 맞히는 것보다 중요한 건 <b>왜 그런지 확인하는 습관</b>이에요. 이름·연락처는 묻지 않고, 점수도 어디에도 저장되지 않아요.</p><button class="btn go" onclick="i=0;sc=0;ask()">시험지 받기 ✍️</button><p class="src">출처: 문화일보(2026.10.8), 서울경제, HSAD 블로그 '[월간 2026밈] 10월 편', issueitnow.com 등 · 확인일 2026-10-23 · 밈 뜻은 계속 바뀔 수 있어요.</p></div>`}
function ask(){const x=Q[i];A.innerHTML=`<div class="card"><div class="meta"><span>${i+1} / ${Q.length}</span><span>점수 ${sc}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="q">${x.q}</div>${x.o.map((o,k)=>`<button class="btn" onclick="pick(${k},this)">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}<div class="why" id="why"></div></div>`}
function pick(k,b){const x=Q[i];document.querySelectorAll('.btn').forEach((e,n)=>{e.disabled=true;if(n==x.a)e.classList.add('ok')});if(k==x.a){sc++;burst(12)}else b.classList.add('no');const w=document.getElementById('why');w.innerHTML=(k==x.a?'⭕ 정답! ':'❌ 아쉽! ')+x.w+`<button class="btn go" onclick="nx()">${i<Q.length-1?'다음 문제 →':'결과 보기 🎉'}</button>`;w.style.display='block'}
function nx(){i++;i<Q.length?ask():end()}
function end(){const r=R.filter(r=>sc>=r[0]).pop();burst(60);A.innerHTML=`<div class="card" style="text-align:center"><span class="tag">결과 발표</span><div class="big">${sc}<small style="font-size:30px">/10</small></div><h1 style="font-size:34px">${r[1]}</h1><p>${r[2]}</p><div class="why" style="display:block;text-align:left">오늘의 한 줄: <b>밈은 계속 바뀐다. 모르면, 확인하고 쓰자.</b></div><button class="btn go" onclick="start()">한 번 더 도전</button></div>`}
function burst(n){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let k=0;k<n;k++){const c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#ff4f9a','#c6ff3d','#7b3cff','#ffcc00'][k%4];c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
start();
</script></body></html>
